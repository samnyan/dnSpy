name: GitHub CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Feature branches in this repository are already covered by the push trigger.
    # Keep pull_request builds for PRs coming from external forks without running
    # the same matrix twice for our own feature/** branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        platform: [netframework, net, net-x86, net-x64]
        include:
          - platform: netframework
            package-name: netframework
            build-dir: net48
          - platform: net
            package-name: net
            build-dir: net10.0-windows
          - platform: net-x86
            package-name: net-win32
            build-dir: net10.0-windows\\win-x86\\publish
          - platform: net-x64
            package-name: net-win64
            build-dir: net10.0-windows\\win-x64\\publish

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Build dnSpy (${{ matrix.platform }})
        run: .\\build.ps1 ${{ matrix.platform }}

      - name: Create artifact directory
        run: New-Item -ItemType Directory -Path C:\\builtfiles\\dnSpy-${{ matrix.platform }} -Force > $null

      - name: Copy release files
        run: Copy-Item -Path dnSpy\\dnSpy\\bin\\Release\\${{ matrix.build-dir }}\\* -Destination C:\\builtfiles\\dnSpy-${{ matrix.platform }} -Recurse

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dnSpy-${{ matrix.package-name }}
          path: C:\\builtfiles\\dnSpy-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
